# CI for pull requests and master (SPEC section 12.1).
# No secrets, no signing, no deployment environment: fork PRs run safely.
name: ci

# Triggers restored 2026-11-08 after the first green manual run (42481321186): the earlier
# failures were a missing Xcode 27.1 on the runner (now pinned to 26.6) and wall-clock tests.
on:
  pull_request:
  push:
    branches: [master]
    # Release tags run release.yml (Story 6.2), not this workflow.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode from .xcode-version
        run: |
          version="$(tr -d '[:space:]' < .xcode-version)"
          app="/Applications/Xcode_${version}.app"
          if [ ! -d "$app" ]; then
            echo "::error::$app not found on this runner. Installed Xcode versions:"
            ls -d /Applications/Xcode* || true
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Lint (swift-format)
        run: xcrun swift format lint --strict --recursive Packages App/Sources

      - name: Package tests
        run: |
          for manifest in Packages/*/Package.swift Packages/*/*/Package.swift; do
            [ -f "$manifest" ] || continue
            pkg="$(dirname "$manifest")"
            echo "==> swift test: $pkg"
            (cd "$pkg" && swift test --build-system swiftbuild)
          done

      - name: version
        id: version
        run: |
          tag=""
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then tag="$GITHUB_REF_NAME"; fi
          Scripts/tests/version-test.sh
          Scripts/tests/dev-signing-test.sh
          Scripts/tests/signing-xcconfig-test.sh
          Scripts/tests/release-check-tag-test.sh
          Scripts/tests/release-package-test.sh
          Scripts/tests/release-dry-run-test.sh
          Scripts/tests/release-sparkle-test.sh
          Scripts/version.sh ${tag:+--tag "$tag"} --build "$GITHUB_RUN_NUMBER" --xcconfig App/Config/Version.xcconfig
          cat App/Config/Version.xcconfig

      - name: Generate Xcode project
        run: cd App && xcodegen generate

      - name: Build app
        run: |
          xcodebuild -project App/Vigie.xcodeproj -scheme Vigie -configuration Debug build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO -derivedDataPath App/DerivedData

      # TODO: switch to `build test` (and merge with the step above) once the app has a test
      # target; the scheme currently has no test action, so `xcodebuild test` errors out.
      - name: xcodebuild-test
        id: xcodebuild-test
        run: echo "not yet - app scheme has no test target"

      - name: Locale check
        run: |
          app="$(find App/DerivedData/Build/Products/Debug -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app" || { echo "::error::no .app in build products"; exit 1; }
          Scripts/check-locales.sh "$app"

      - name: theme-regen-diff
        id: theme-regen-diff
        run: Scripts/theme-regen-check.sh

      - name: view-literals
        id: view-literals
        run: Scripts/check-view-literals.sh

      - name: contrast-check
        id: contrast-check
        run: Scripts/check-contrast.sh --quiet

      - name: spi-host-guard
        id: spi-host-guard
        run: Scripts/check-spi-host.sh

      - name: process-launch-guard
        id: process-launch-guard
        run: Scripts/check-process-launch.sh

      - name: package-deps-guard
        id: package-deps-guard
        run: Scripts/check-package-deps.sh

      - name: cli-no-keychain-guard
        id: cli-no-keychain-guard
        run: Scripts/check-cli-no-keychain.sh

      - name: module-pasteboard-guard
        id: module-pasteboard-guard
        run: Scripts/check-module-pasteboard.sh && Scripts/tests/module-pasteboard-test.sh

      - name: test-windows-guard
        id: test-windows-guard
        run: Scripts/check-test-windows.sh && Scripts/tests/test-windows-test.sh

      - name: module-away-guard
        id: module-away-guard
        run: Scripts/check-module-away.sh && Scripts/tests/module-away-test.sh

      - name: services-plist
        id: services-plist
        run: Scripts/check-services-plist.sh

      - name: script-schema
        id: script-schema
        run: Scripts/check-script-schema.sh

      - name: adapter-fixtures
        id: adapter-fixtures
        run: echo "not yet"

      - name: config-corpus
        id: config-corpus
        run: Scripts/config-corpus.sh

      - name: spool-floor
        id: spool-floor
        run: Scripts/spool-floor-test.sh
