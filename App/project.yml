# XcodeGen spec for the thin Vigie app target (AD-2).
# Generate with `xcodegen generate` in this folder; Vigie.xcodeproj is not committed.
name: Vigie
options:
  bundleIdPrefix: fr.baguettelabs
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  Wire:
    path: ../Packages/Wire
  ModuleKit:
    path: ../Packages/ModuleKit
  VigieUI:
    path: ../Packages/VigieUI
  VigieCore:
    path: ../Packages/VigieCore
  AgentKit:
    path: ../Packages/AgentKit
  AgentsSessions:
    path: ../Packages/Modules/AgentsSessions
  AgentsUsage:
    path: ../Packages/Modules/AgentsUsage
  Shelf:
    path: ../Packages/Modules/Shelf
  Time:
    path: ../Packages/Modules/Time
  Calendar:
    path: ../Packages/Modules/Calendar
  Notes:
    path: ../Packages/Modules/Notes
  Integrations:
    path: ../Packages/Modules/Integrations
  ClaudeAdapter:
    path: ../Packages/Adapters/Claude
  GenericTerminal:
    path: ../Packages/Terminals/Generic
  TerminalAppTerminal:
    path: ../Packages/Terminals/TerminalApp
  ITermTerminal:
    path: ../Packages/Terminals/ITerm
  WarpTerminal:
    path: ../Packages/Terminals/Warp
  # Auto-update (Story 6.3, AD-16 allowlist): App target only (AD-2), never a package dependency. Pinned exactly;
  # Scripts/release/sparkle.sh downloads the same version's command-line tools (sign_update) by checksum.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

# Signing (Story 6.1, AD-17, AD-20; maintainer steps in docs/release-setup.md). Config/Signing.xcconfig
# (committed) is the only place signing is set: the target below sets no signing key, since target settings
# would win over it.
#   Release: Developer ID Application, team BWMPMACCYZ, manual style, profile "Vigie Developer ID",
#            Vigie.signed.entitlements (apple-events + keychain-access-groups), Hardened Runtime, no sandbox,
#            secure timestamp. release.yml (Story 6.2) only imports the certificate and profile.
#   Debug:   ad-hoc with Vigie.entitlements (CI, Macs without the team), unless the optional, gitignored
#            Signing.local.xcconfig written by `Scripts/dev-signing.sh --team <TeamID>` switches it to automatic
#            signing (Apple Development + Xcode-managed `.dev` profile) and Vigie.signed.entitlements.
# Signing.xcconfig also includes Version.xcconfig, generated by Scripts/version.sh (Story 6.4) and gitignored
# (Scripts/ci-local.sh and the CI "version" step create it before `xcodegen generate`).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Vigie:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
      - path: Assets.xcassets
      # Info.plist and Vigie.entitlements are referenced through build settings below.
    dependencies:
      - package: VigieCore
      - package: VigieUI
      - package: ModuleKit
      - package: Wire
      - package: AgentKit
      - package: AgentsSessions
      - package: AgentsUsage
      - package: Shelf
      - package: Time
      - package: Calendar
      - package: Notes
      - package: Integrations
      - package: ClaudeAdapter
      - package: GenericTerminal
      - package: TerminalAppTerminal
      - package: ITermTerminal
      - package: WarpTerminal
      - package: Sparkle
    # Feed URL and public EdDSA key of the updater (Story 6.3), read by Info.plist. Target level, so it stays out of
    # Config/Signing.xcconfig.
    configFiles:
      Debug: Config/Updates.xcconfig
      Release: Config/Updates.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_MODULE_NAME: Vigie
        # Signing (identity, style, team, profile, entitlements, Hardened Runtime) lives only in
        # Config/Signing.xcconfig and the gitignored Config/Signing.local.xcconfig (Story 6.1, AD-17, AD-20).
        # None of those keys may be set here: target settings win over the project's xcconfig.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        # The "Embed vigie CLI" phase runs `swift build`, which reads the whole package tree.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Debug = dev flavor, Release = release flavor (AD-17). Single source of truth;
        # Wire/Package.swift defines the same VIGIE_DEV condition for its debug configuration.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) VIGIE_DEV
          PRODUCT_BUNDLE_IDENTIFIER: fr.baguettelabs.vigie.dev
          PRODUCT_NAME: Vigie Dev
          VIGIE_DISPLAY_NAME: Vigie Dev
          # AppEnvironment.cliName for the dev flavor (AD-17).
          VIGIE_CLI_NAME: vigie-dev
          # CFBundleURLTypes scheme = AppEnvironment.urlScheme (AD-17, AD-20, A89): dev links never open the release app.
          VIGIE_URL_SCHEME: vigie-dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: fr.baguettelabs.vigie
          PRODUCT_NAME: Vigie
          VIGIE_DISPLAY_NAME: Vigie
          VIGIE_CLI_NAME: vigie
          VIGIE_URL_SCHEME: vigie

    # Bundles the `vigie` CLI (FR8, AD-22): Packages/VigieCLI is built with SwiftPM in the same
    # configuration as the app (Debug -> VIGIE_DEV, so the dev app ships `vigie-dev` talking to the
    # dev socket) and copied to Contents/Helpers/$(VIGIE_CLI_NAME); its String Catalog bundle goes
    # to Contents/Resources, where the CLI looks for it (VigieCLI/CLIResources.swift).
    # Always runs: `swift build` is its own dependency analysis (a no-op build takes about a
    # second), and files are only replaced when their content changed.
    postCompileScripts:
      - name: Embed vigie CLI
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/$(VIGIE_CLI_NAME)
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/VigieCLI_VigieCLI.bundle
        script: |
          set -euo pipefail
          PACKAGE="${SRCROOT}/../Packages/VigieCLI"
          SCRATCH="${PROJECT_TEMP_DIR}/VigieCLI-swiftpm"
          case "${CONFIGURATION}" in
            Release) SWIFT_CONFIG=release ;;
            *) SWIFT_CONFIG=debug ;;
          esac
          # A clean environment: Xcode's build settings (SDKROOT, ARCHS, ...) must not leak into SwiftPM.
          swiftpm() {
            env -i HOME="${HOME}" PATH="/usr/bin:/bin:/usr/sbin:/sbin" DEVELOPER_DIR="${DEVELOPER_DIR}" \
              /usr/bin/xcrun swift build --package-path "${PACKAGE}" --scratch-path "${SCRATCH}" \
              --build-system swiftbuild -c "${SWIFT_CONFIG}" --product vigie "$@"
          }
          swiftpm
          BIN_DIR="$(swiftpm --show-bin-path)"
          HELPERS="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          RESOURCES="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          TARGET="${HELPERS}/${VIGIE_CLI_NAME}"
          mkdir -p "${HELPERS}" "${RESOURCES}"
          if [ ! -f "${TARGET}" ] || [ "${BIN_DIR}/vigie" -nt "${TARGET}" ]; then
            ditto "${BIN_DIR}/vigie" "${TARGET}"
            # Signed with the app's identity (Apple Development in dev, Developer ID Application in release,
            # ad-hoc when none), so the helper's designated requirement is as stable as the app's. Hardened
            # Runtime and no entitlements (AD-20: codesign gets no entitlements file, so it writes none); a
            # secure timestamp whenever a real identity signs Release, as notarization requires. Skipped when
            # signing is off (CI passes CODE_SIGNING_ALLOWED=NO).
            if [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ]; then
              IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
              TIMESTAMP=--timestamp=none
              if [ "${CONFIGURATION}" = Release ] && [ "${IDENTITY}" != "-" ]; then TIMESTAMP=--timestamp; fi
              codesign --force --sign "${IDENTITY}" "${TIMESTAMP}" --options runtime \
                --identifier "${PRODUCT_BUNDLE_IDENTIFIER}.cli" "${TARGET}"
            fi
          fi
          rsync -a --checksum --delete "${BIN_DIR}/VigieCLI_VigieCLI.bundle/" "${RESOURCES}/VigieCLI_VigieCLI.bundle/"

schemes:
  Vigie:
    build:
      targets:
        Vigie: all
    run:
      config: Debug
    archive:
      config: Release
