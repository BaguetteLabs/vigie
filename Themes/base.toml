c-accent-light = "{colors.c-light-gold}"
ring-only-away = "center pause mark, two 1px bars"
ring-only-break-due = "center small triangle"
size-beacon = "26px"
size-closed = "23px"
size-row = "30px"
work = "solid arc"

[components.time-tab]
item-row = "30px 1fr 92px 196px"
item-row-height = "62px"
rows = "84px 1fr"

[components.widget-card]
